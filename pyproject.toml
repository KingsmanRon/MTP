# =============================================================================
# INNTRIS CORE - PROJECT CONFIGURATION
# =============================================================================
# Protecting Intellect. The Universal Liability Shield for Autonomous Agents.
# © 2026 Inntris INC. All rights reserved.

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inntris"
version = "1.0.0"
description = "Inntris Core - Verification & Liability Platform for AI Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Inntris INC"}
]
keywords = ["ai", "agents", "verification", "blockchain", "audit", "mcp", "inntris"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "redis>=5.0.0,<6.0.0",
    "pynacl>=1.5.0,<2.0.0",
    "web3>=6.15.0,<7.0.0",
    "eth-account>=0.11.0,<1.0.0",
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.26.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # Phase 2C: Prometheus scrape endpoint (/metrics). The observability
    # module has a no-op fallback if this is missing, so the dep is
    # technically soft — but we want it installed in every real deploy.
    "prometheus-client>=0.20.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=24.1.0,<25.0.0",
    "ruff>=0.2.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "types-redis>=4.6.0",
    # Migrations (Phase 1D.1). Only needed on the operator's machine or in CI,
    # not at API runtime — keep out of the runtime ``dependencies`` list.
    "alembic>=1.13.0,<2.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/inntris/inntris-core"
Documentation = "https://docs.inntris.com"
Repository = "https://github.com/inntris/inntris-core"

[project.scripts]
inntris-api = "api.main:main"
inntris-worker = "workers.anchor_worker:main"
inntris-server = "mcp_server.server:main"

# -----------------------------------------------------------------------------
# Tool Configuration
# -----------------------------------------------------------------------------

[tool.setuptools.packages.find]
include = ["api*", "mcp_server*", "workers*", "config*"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | contracts
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from within except
]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "contracts",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "nacl.*",
    "web3.*",
    "mcp.*",
    "asyncpg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "blockchain: marks tests that interact with blockchain",
]

[tool.coverage.run]
source = ["api", "mcp_server", "workers"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
