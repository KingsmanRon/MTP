# =============================================================================
# CI — backend, frontend, packages, action, and Solidity
# =============================================================================
# Five parallel jobs cover the Python backend, Next.js frontend, trust badge
# package, GitHub Action bundle, and Solidity contract. Each job fails
# independently so reviewers can see where the breakage is.
#
# Intentionally NOT in this workflow:
#   * Mainnet/testnet RPC calls — contract tests use a local EVM via
#     forge's anvil-less in-process runner.
#   * Security scanners, which run in security.yml.

name: ci

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:

# Cancel outdated runs on the same PR branch so we do not queue N copies.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (pytest + ruff)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_USER: inntris_migrator
          POSTGRES_PASSWORD: ci_migrator_only_not_a_secret_2026
          POSTGRES_DB: inntris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inntris_migrator -d inntris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.7-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ALEMBIC_DATABASE_URL: postgresql://inntris_migrator:ci_migrator_only_not_a_secret_2026@localhost:5432/inntris
      RUNTIME_DATABASE_PASSWORD: ci_runtime_only_not_a_secret_2026
      DATABASE_URL: postgresql://inntris_worker:ci_runtime_only_not_a_secret_2026@localhost:5432/inntris
      REDIS_URL: redis://localhost:6379/15
      INNTRIS_DB_INTEGRATION: "1"
      INNTRIS_REDIS_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: replay migrations on clean Postgres
        run: alembic upgrade head

      - name: configure locked down runtime database role
        run: python scripts/configure_runtime_role.py

      - name: ruff
        run: ruff check api workers mcp_server tests evidence_pack scripts

      - name: pytest
        # The service backed tests cover GDPR, RLS, Redis abuse limits, and
        # sandbox exclusion from the real Postgres anchoring selection query.
        run: pytest -q

  frontend:
    name: frontend (jest + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 hit end-of-life in April 2026; 22 is the active LTS.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: type-check
        run: npm run type-check

      - name: test
        run: npm test -- --ci

      - name: build
        # Build fails fast on server-component / RSC misconfiguration that
        # jest does not catch. Env vars are not required for the build
        # itself; Next reads them at runtime.
        run: npm run build

  action:
    name: action (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: github-action/package-lock.json

      - name: install
        run: npm ci

      - name: unit tests
        run: npm test

      # The bundled dist/ is committed and is what GitHub runs for the action.
      # Fail if it is stale so a source change can never ship without its
      # rebuilt bundle.
      - name: verify bundle is current
        run: |
          npm run build
          git diff --exit-code -- dist/ \
            || { echo "::error::github-action/dist is stale; run 'npm --prefix github-action run build' and commit."; exit 1; }

  trust-widget:
    name: trust widget (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trust_widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: trust_widget/package-lock.json

      - name: install
        run: npm ci

      - name: type-check
        run: npm run typecheck

      - name: build
        run: npm run build

  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge version
        run: forge --version

      # If OpenZeppelin and forge-std are not yet vendored as submodules,
      # install them into lib/. This keeps the workflow green on a fresh
      # clone where the submodule add has not been committed yet.
      # (forge >= 1.0 removed --no-commit; install no longer commits.)
      - name: ensure submodules
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std
          fi
          if [ ! -d lib/openzeppelin-contracts ]; then
            forge install OpenZeppelin/openzeppelin-contracts
          fi

      - name: forge build
        run: forge build --sizes

      - name: forge test
        run: forge test -vvv
