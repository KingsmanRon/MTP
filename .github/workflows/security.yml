# =============================================================================
# Security scanning — Phase 5.3
# =============================================================================
# Five independent release-blocking jobs, including a built production image scan:
#   * image-scan — builds the API target and blocks high or critical image CVEs.
#   * sast      — Semgrep with the OWASP + security-audit rulesets.
#   * sca       — pip-audit + npm audit for known-CVE dependencies.
#   * fs-scan   — Trivy configuration and working-tree secret scan.
#   * secrets-history — Gitleaks scan across the complete Git history.
#
# Runs on every PR and every push to master, plus a weekly schedule so a
# CVE that lands between pushes is still caught within 7 days.

name: security

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # security-events write is required so Semgrep / Trivy results can be
  # uploaded as SARIF to the Security tab. Keep the minimum necessary.
  security-events: write
  # codeql-action/upload-sarif reads the workflow run to attach results;
  # without this the upload 403s ("Resource not accessible by integration").
  actions: read

jobs:
  sast:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    # Public action from returntocorp; pinned to a major version. Dependabot
    # bumps this under ``github-actions`` ecosystem.
    container:
      image: returntocorp/semgrep:1.169.0
    steps:
      - uses: actions/checkout@v4

      - name: semgrep scan
        # p/owasp-top-ten catches the canonical web-app vuln classes.
        # p/security-audit adds language-specific patterns.
        # r2c-security-audit is the maintainer's curated baseline.
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/python \
            --config p/javascript \
            --error \
            --sarif --output semgrep.sarif

      # Code scanning needs GitHub Advanced Security on private repos; until
      # that is enabled in the repo settings the upload is best-effort and the
      # artifact below is the reviewable copy of the findings.
      - name: upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  sca:
    name: sca (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install pip-audit + project deps
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e '.[dev]'

      - name: pip-audit
        run: |
          python -m pip freeze --exclude-editable > /tmp/inntris-installed.txt
          pip-audit -r /tmp/inntris-installed.txt \
            --no-deps --disable-pip --desc --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            github-action/package-lock.json
            trust_widget/package-lock.json

      - name: npm audit (frontend)
        working-directory: frontend
        # --audit-level=high so only High + Critical block the build. Low/
        # moderate go into a weekly report the team reviews; not every
        # moderate CVE is exploitable in our dep graph.
        run: npm audit --audit-level=high

      - name: npm audit (GitHub Action)
        working-directory: github-action
        run: npm audit --audit-level=high

      - name: npm audit (trust widget)
        working-directory: trust_widget
        run: npm audit --audit-level=high

  fs-scan:
    name: trivy (filesystem + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Catch:
          #   * vuln — known CVEs in any lockfile we have
          #   * config — Dockerfile / IaC / Kubernetes misconfig
          #   * secret — accidentally committed credentials
          # Dependency CVEs are handled above with production aware pip and npm
          # gates. Trivy blocks high severity configuration and secret findings.
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "1"

      # Best-effort while code scanning (GHAS) is off; see the sast job note.
      - name: upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif

  image-scan:
    name: trivy (production image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build production API image
        run: docker build --target api --tag "inntris-api:${GITHUB_SHA}" .

      - name: scan production API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: inntris-api:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  secrets-history:
    name: gitleaks (full git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so a secret committed-then-removed is still caught

      - name: gitleaks full history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --report-format sarif --report-path /repo/gitleaks.sarif

      # Best-effort while code scanning (GHAS) is off; see the sast job note.
      - name: upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
