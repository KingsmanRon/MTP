version: 1

# Inntris AI PR Guard policy.
#
# The Inntris CI Guard action reads this file, inspects the files changed by a
# pull request (or push), maps them to Inntris action types, and verifies the
# strongest risk category (or each high-risk category separately) with Inntris
# Core. The required GitHub check passes only if every Inntris verification
# approves.
#
# Priority order (strongest wins): production_deployment >
# protected_branch_merge > ci_workflow_change > repo_change.

# Enforcement behaviour when the guard cannot classify a change -- a missing
# policy, or changed files that cannot be reliably determined (no token, a
# shallow clone, a GitHub API failure). fail_closed: true BLOCKS rather than
# silently downgrading a high-risk change to an ungated attestation. This is
# the secure default; set it to false only for non-regulated repositories.
enforcement:
  fail_closed: true

protected_paths:
  - src/auth/**
  - src/session/**
  - src/tenant/**
  - src/phi/**
  - src/patient/**
  - src/middleware.ts
  - database/migrations/**
  - supabase/migrations/**
  - .github/workflows/**
  - infra/**
  - "**/.env*"

low_risk_paths:
  - docs/**
  - README.md
  - src/components/**

# Branches whose merges are gated as protected_branch_merge. This is a BRANCH
# condition, not a path condition: any change whose target branch matches one
# of these patterns is a protected-branch merge (trust >= 80), so the receipt
# is truthful. Sensitive code paths (auth, migrations, ...) live in
# protected_paths above for the protected_path_changed audit flag; they gate
# at the high bar when, and only when, they actually merge to a protected
# branch.
protected_branches:
  - main
  - "release/*"
  - production

# Path -> action type. protected_branch_merge is intentionally absent here: it
# is derived from protected_branches, not from file paths.
mapping:
  ci_workflow_change:
    - .github/workflows/**
  production_deployment:
    - infra/**
    - deploy/**
    - terraform/**
    - k8s/**
  repo_change:
    - docs/**
    - README.md
    - src/components/**
