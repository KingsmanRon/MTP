# =============================================================================
# MACHINE TRUST PROTOCOL - DOCKER COMPOSE
# =============================================================================
# Production-ready orchestration for MTP services
# Includes: PostgreSQL, Redis, Core API, Anchor Worker
# =============================================================================

version: "3.9"

services:
  # ===========================================================================
  # DATABASE: PostgreSQL with TimescaleDB
  # ===========================================================================
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: mtp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtp_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-mtp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtp} -d ${POSTGRES_DB:-mtp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtp-network

  # ===========================================================================
  # CACHE: Redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: mtp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtp-network

  # ===========================================================================
  # CORE API: The Central Bank
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: mtp-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mtp}:${POSTGRES_PASSWORD:-mtp_secure_password}@postgres:5432/${POSTGRES_DB:-mtp}
      - REDIS_URL=redis://redis:6379
      - SERVER_SECRET=${SERVER_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - PORT=8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mtp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mtp-api.rule=Host(`api.mtp.local`)"
      - "traefik.http.services.mtp-api.loadbalancer.server.port=8000"

  # ===========================================================================
  # ANCHOR WORKER: The Forensic Recorder
  # ===========================================================================
  anchor-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: anchor-worker
    container_name: mtp-anchor-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mtp}:${POSTGRES_PASSWORD:-mtp_secure_password}@postgres:5432/${POSTGRES_DB:-mtp}
      - BASE_RPC_URL=${BASE_RPC_URL:-https://mainnet.base.org}
      - ANCHOR_CONTRACT_ADDRESS=${ANCHOR_CONTRACT_ADDRESS}
      - BLOCKCHAIN_PRIVATE_KEY=${BLOCKCHAIN_PRIVATE_KEY}
      - ANCHOR_BATCH_SIZE=${ANCHOR_BATCH_SIZE:-1000}
      - ANCHOR_BATCH_INTERVAL=${ANCHOR_BATCH_INTERVAL:-3600}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mtp-network

  # ===========================================================================
  # MCP SERVER: Universal Adapter (Standalone)
  # ===========================================================================
  # Note: The MCP server is typically run alongside the agent process,
  # not as a separate container. This is provided for testing purposes.
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-server
    container_name: mtp-mcp-server
    restart: "no"
    profiles:
      - mcp  # Only start with: docker compose --profile mcp up
    environment:
      - MTP_API_URL=http://api:8000
      - MTP_AGENT_ID=${MTP_AGENT_ID}
      - MTP_PRIVATE_KEY_B64=${MTP_PRIVATE_KEY_B64}
      - MTP_TIMEOUT=30
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mtp-network
    stdin_open: true
    tty: true

  # ===========================================================================
  # OPTIONAL: Traefik Reverse Proxy
  # ===========================================================================
  traefik:
    image: traefik:v2.10
    container_name: mtp-traefik
    restart: unless-stopped
    profiles:
      - proxy  # Only start with: docker compose --profile proxy up
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mtp-network

  # ===========================================================================
  # OPTIONAL: pgAdmin for Database Management
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mtp-pgadmin
    restart: unless-stopped
    profiles:
      - tools  # Only start with: docker compose --profile tools up
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mtp.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - mtp-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  mtp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
