# =============================================================================
# INNTRIS CORE: SECURITY HARDENED COMPOSE REFERENCE
# =============================================================================
# Copy .env.example to .env, generate every required secret, and keep .env out
# of version control. PostgreSQL and Redis are reachable only on the private
# backend network. The API is loopback bound unless the proxy profile is used.
# =============================================================================

services:
  postgres:
    # Pin releases so deployments do not change when an upstream latest tag moves.
    image: timescale/timescaledb:2.28.2-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inntris_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-inntris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  redis:
    image: redis:7.4.7-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      ALEMBIC_DATABASE_URL: ${ALEMBIC_DATABASE_URL:?Set the privileged migration DSN}
      DATABASE_URL: ${DATABASE_URL:?Set the separate inntris_worker runtime DSN}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Set the runtime role password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set the inntris_worker runtime DSN}
      REDIS_URL: ${REDIS_URL:?Set the authenticated Redis URL}
      SERVER_SECRET: ${SERVER_SECRET:?Set SERVER_SECRET to at least 32 random characters}
      MASTER_ADMIN_KEY: ${MASTER_ADMIN_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the production CORS origins}
      VERIFY_SOURCE_ATTEMPTS_PER_MINUTE: ${VERIFY_SOURCE_ATTEMPTS_PER_MINUTE:-300}
      VERIFY_AGENT_ATTEMPTS_PER_MINUTE: ${VERIFY_AGENT_ATTEMPTS_PER_MINUTE:-120}
      VERIFY_AGENT_SIGNATURE_CONCURRENCY: ${VERIFY_AGENT_SIGNATURE_CONCURRENCY:-20}
      WEBHOOK_RECOVERY_POLL_SECONDS: ${WEBHOOK_RECOVERY_POLL_SECONDS:-5}
      WEBHOOK_RECOVERY_BATCH_SIZE: ${WEBHOOK_RECOVERY_BATCH_SIZE:-50}
      WEBHOOK_DELIVERY_CONCURRENCY: ${WEBHOOK_DELIVERY_CONCURRENCY:-20}
      PORT: "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  anchor-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: anchor-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set the inntris_worker runtime DSN}
      BLOCKCHAIN_PROVIDER_URL: ${BLOCKCHAIN_PROVIDER_URL:-https://base-rpc.publicnode.com}
      # Read-only failover so an already-broadcast transaction can still
      # reconcile while the primary refuses receipt reads (for example 403).
      BLOCKCHAIN_READ_PROVIDER_URLS: ${BLOCKCHAIN_READ_PROVIDER_URLS:-https://mainnet.base.org}
      ANCHOR_CONTRACT_ADDRESS: ${ANCHOR_CONTRACT_ADDRESS:?Set the deployed anchor contract}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:?Set the dedicated anchor wallet key}
      ANCHOR_BATCH_SIZE: ${ANCHOR_BATCH_SIZE:-1000}
      # Ten minutes, matching the worker and production runbook default.
      ANCHOR_INTERVAL_MINUTES: ${ANCHOR_INTERVAL_MINUTES:-10}
      ANCHOR_METRICS_ENABLED: "true"
      # Listen on the container network only. No host port is published.
      ANCHOR_METRICS_ADDRESS: 0.0.0.0
      ANCHOR_METRICS_PORT: "9100"
    expose:
      - "9100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - worker-egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-server
    restart: "no"
    profiles:
      - mcp
    environment:
      INNTRIS_API_URL: http://api:8000
      INNTRIS_AGENT_ID: ${INNTRIS_AGENT_ID:-}
      INNTRIS_PRIVATE_KEY_B64: ${INNTRIS_PRIVATE_KEY_B64:-}
      INNTRIS_TIMEOUT: "30"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  traefik:
    image: traefik:v3.6.23
    restart: unless-stopped
    profiles:
      - proxy
    command:
      - --api.dashboard=false
      - --providers.file.filename=/etc/traefik/dynamic/dynamic.yml
      - --providers.file.watch=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic/dynamic.yml
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:9.15.0
    restart: unless-stopped
    profiles:
      - tools
    environment:
      # Empty values make pgAdmin fail closed. No checked in default credential.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:

configs:
  # Static discovery avoids granting the edge proxy access to docker.sock.
  traefik_dynamic:
    content: |
      http:
        routers:
          inntris-api:
            rule: "Host(`${API_HOSTNAME:-api.inntris.local}`)"
            entryPoints:
              - websecure
            service: inntris-api
            tls: {}
        services:
          inntris-api:
            loadBalancer:
              servers:
                - url: http://api:8000

networks:
  # Database and Redis have no published ports and no direct internet route.
  backend:
    internal: true
  edge:
  worker-egress:
