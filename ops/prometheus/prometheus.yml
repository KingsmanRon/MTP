global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/inntris-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: inntris-anchor-worker
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - anchor-worker:9100
        labels:
          service: inntris-anchor-worker

  - job_name: inntris-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:8000
        labels:
          service: inntris-api
