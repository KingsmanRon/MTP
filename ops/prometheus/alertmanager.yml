global:
  resolve_timeout: 5m

route:
  receiver: inntris-operations
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: inntris-pager
      matchers:
        - severity="critical"
      repeat_interval: 30m

receivers:
  - name: inntris-operations
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/inntris_operations_webhook_url
        send_resolved: true
  - name: inntris-pager
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/inntris_pager_webhook_url
        send_resolved: true
