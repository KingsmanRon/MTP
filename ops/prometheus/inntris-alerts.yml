groups:
  - name: inntris_api
    rules:
      - alert: InntrisApiScrapeDown
        expr: up{job="inntris-api"} == 0 or absent(up{job="inntris-api"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Inntris API metrics endpoint is unavailable
          description: The API cannot be observed and may not be serving verifications.

      - alert: InntrisVerifyFailClosedUnavailable
        # /verify fails closed when Redis (abuse limits, signature slots,
        # nonce replay cache) is unreachable, so any refusal here means real
        # verification traffic is being turned away with HTTP 503.
        expr: increase(inntris_verify_unavailable_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Inntris /verify is refusing requests fail-closed
          description: >-
            The {{ $labels.component }} security dependency was unavailable and
            verification requests received HTTP 503. Check Redis health first.

  - name: inntris_anchor_worker
    rules:
      - alert: InntrisAnchorWorkerScrapeDown
        expr: up{job="inntris-anchor-worker"} == 0 or absent(up{job="inntris-anchor-worker"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Inntris anchor worker metrics endpoint is unavailable
          description: The anchor worker cannot be observed and may not be processing proofs.

      - alert: InntrisAnchorWorkerHeartbeatStale
        expr: time() - inntris_anchor_worker_heartbeat_timestamp_seconds > 120 or absent(inntris_anchor_worker_heartbeat_timestamp_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Inntris anchor worker heartbeat is stale
          description: The worker process has not reported liveness within 2 minutes.

      - alert: InntrisAnchorWorkerLastSuccessStale
        expr: time() - inntris_anchor_worker_last_success_timestamp_seconds > 900 or absent(inntris_anchor_worker_last_success_timestamp_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Inntris anchor worker has not completed a successful cycle
          description: No complete worker processing cycle has succeeded within 15 minutes.

      - alert: InntrisAnchorWorkerProcessingErrors
        expr: increase(inntris_anchor_worker_cycles_total{outcome="error"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Inntris anchor worker processing failed
          description: At least one complete anchor processing cycle raised an error.

      - alert: InntrisAnchorWorkerLockContention
        expr: increase(inntris_anchor_worker_cycles_total{outcome="lock_contended"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Multiple Inntris anchor workers are competing for one database
          description: A worker skipped processing because another process held the advisory lock.

      - alert: InntrisAnchorProofBacklog
        expr: inntris_anchor_proof_backlog{status=~"failed|dead_letter"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Inntris has failed anchor proofs
          description: Proofs in status {{ $labels.status }} require operator attention.

      - alert: InntrisAnchorSubmissionFailure
        expr: increase(inntris_anchor_submissions_total{outcome=~"failed|dead_letter"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Inntris anchor submission failed
          description: At least one proof submission failed or entered the dead letter queue.

      # A transaction we already broadcast is never marked failed or dead
      # lettered because the RPC will not serve its receipt. Without these two
      # rules that class of incident is silent: the anchor is on chain, the
      # proof sits at submitted, and no failure counter moves.
      - alert: InntrisAnchorRpcReadUnavailable
        expr: increase(inntris_anchor_submissions_total{outcome="read_unavailable"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Inntris anchor reconciliation cannot read chain state
          description: >-
            Every configured RPC endpoint is refusing receipt or contract-state
            reads (for example HTTP 403). Affected proofs stay retryable and are
            not dead lettered. Add or repair BLOCKCHAIN_READ_PROVIDER_URLS, then
            run the anchor worker with --reconcile-unresolved. See runbook 3a.

      - alert: InntrisAnchorProofAwaitingReconciliation
        expr: inntris_anchor_proof_backlog{status="awaiting_reconciliation"} > 0
        for: 45m
        labels:
          severity: warning
        annotations:
          summary: Inntris has a broadcast anchor transaction with no confirmation
          description: >-
            A proof has held a transaction hash without reaching confirmed for
            45 minutes. Verify the hash on an independent RPC or explorer before
            any operator action, and never clear the hash. See runbook 3a.

      - alert: InntrisAnchorRpcPrimaryReadFailover
        expr: increase(inntris_anchor_rpc_read_failover_total{endpoint="primary"}[15m]) > 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: Inntris anchor reads are running on failover RPC endpoints
          description: >-
            The primary RPC is not serving reads for operation
            {{ $labels.operation }}. Anchoring still works, but the primary
            needs attention before the failover endpoint also degrades.

  # ===========================================================================
  # Phase 7A, Gate 8 — the execution authority lifecycle
  # ===========================================================================
  # Every threshold below comes from docs/AUTHORITY_SLO.md, which quotes what
  # loadtests/authority_benchmark.py measured. None was chosen by intuition: a
  # threshold picked that way either fires constantly or never fires, and both
  # are worse than no alert.
  - name: inntris_authority
    rules:
      - alert: InntrisAuthorityConsumeFailures
        # A consume failure is money that may not have moved when somebody
        # believes it did. Rejections are normal (a revoked delegation, a
        # suspended principal); ERRORS are not, and they are counted apart.
        expr: increase(inntris_authority_consumptions_total{outcome="error"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Execution authority consumption is raising errors
          description: >
            A consumption raised rather than returning a decision, so the
            caller does not know whether authority was spent. See
            docs/runbooks/authority_incident.md.

      - alert: InntrisAuthorityDeadlocks
        # Gate 7 release blocker. Measured at 14% on the multi-principal
        # consume path; the objective is zero, so any sustained rate is the
        # known defect recurring rather than a new surprise.
        expr: increase(inntris_authority_consumptions_total{reason="exception"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Authority consumption is failing repeatedly
          description: >
            Consumption exceptions over 15 minutes. If these are PostgreSQL
            40P01 deadlocks this is the known Gate 7 blocker in
            docs/AUTHORITY_SLO.md; reduce concurrent consumption per
            principal and escalate.

      - alert: InntrisAuthorityEvaluationSlow
        # SLO: p99 < 500ms, from a measured 132ms multi-principal p99.
        expr: >
          histogram_quantile(
            0.99,
            sum(rate(inntris_authority_evaluation_latency_seconds_bucket[10m])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Authority evaluation p99 is above its measured SLO
          description: >
            p99 above 500ms for 10 minutes. Measured baseline is 132ms
            multi-principal. Concurrent load against ONE principal is the
            usual cause -- the audit hash chain serialises per agent.

      - alert: InntrisAuthorityConsumeSlow
        # SLO: p99 < 250ms.
        expr: >
          histogram_quantile(
            0.99,
            sum(rate(inntris_authority_consume_latency_seconds_bucket[10m])) by (le)
          ) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Authority consumption p99 is above its measured SLO
          description: >
            Contention shows here before anywhere else. Check concurrent
            consumptions per principal.

      - alert: InntrisAuthorityPolicyRevalidationFailures
        # Expected in a burst right after a deliberate policy change, so this
        # alerts on a SUSTAINED rate rather than on any occurrence.
        expr: sum(rate(inntris_authority_policy_revalidation_failures_total[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Grants are repeatedly failing policy revalidation at consumption
          description: >
            Sustained refusals because current policy no longer matches what a
            grant was issued under. A burst after a policy change is expected;
            a sustained rate means something is issuing authority it cannot
            spend. See the reason label.

      - alert: InntrisAuthorityKeyResolutionFailures
        # OUR fault, not the caller's: we could not establish issuer trust at
        # all. Fails closed, so nothing unsafe happens -- but nothing is
        # authorised either.
        expr: increase(inntris_authority_key_resolution_failures_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Inntris cannot establish delegated-authority trust
          description: >
            Issuer trust or revocation state could not be resolved, so new
            delegated authority is being refused fail-closed. Check the
            database and the trust configuration before anything else.

      - alert: InntrisAuthorityVerificationFailureSpike
        # Callers presenting delegations that do not verify. Counted apart
        # from the alert above because the remedy is entirely different.
        expr: sum(rate(inntris_authority_verification_failures_total[15m])) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Delegated authority is failing verification at an unusual rate
          description: >
            See the code label. authority_revoked in bulk may mean an issuer
            revoked a key; authority_principal_mismatch in bulk may mean a
            provisioning error in principal bindings.

      - alert: InntrisAuthorityUnresolvedOutcomes
        # These hold spend capacity that is NEVER released automatically,
        # because "we could not ask" is not "it did not happen". A growing
        # number means reconciliation is falling behind real executions.
        expr: inntris_authority_unresolved_outcomes > 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Consumed grants with unknown downstream outcomes are accumulating
          description: >
            Each one holds spend capacity indefinitely by design. Work the
            reconciliation procedure in docs/runbooks/authority_incident.md.
            Do NOT release capacity without the rail's own evidence.

      - alert: InntrisAuthorityIssuanceHalted
        # Informational but must not be silent: a halt left engaged after an
        # incident is an outage nobody is looking at.
        expr: inntris_authority_kill_switch_engaged{control="authority_issuance"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: The authority issuance kill switch has been engaged for 30 minutes
          description: >
            No new execution authority is being issued in that scope. Release
            it with scripts/authority_control.py restore once the incident is
            over.

      - alert: InntrisAuthorityRequirementSuppressed
        # The ONE control that weakens enforcement. It should never be on
        # quietly.
        expr: inntris_authority_kill_switch_engaged{control="requirement_enforcement"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Delegated-authority requirements are being SUPPRESSED
          description: >
            The requirement_enforcement kill switch is engaged, so acts an
            organisation configured to require a delegation are proceeding
            without one. This is a deliberate rollback lever and must not be
            left engaged.
