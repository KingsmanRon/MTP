# =============================================================================
# Alembic configuration for Inntris (Phase 1D.1)
# =============================================================================
# We use Alembic for forward-only, versioned schema migrations. Raw-SQL
# migrations under ``database/migrations/`` were the pre-1D.1 baseline and
# are re-run verbatim by revision 0001_baseline. Post-baseline migrations
# live as Alembic revisions under ``alembic/versions/``.
#
# DSN is intentionally NOT set here. ``alembic/env.py`` reads ``DATABASE_URL``
# from the process env (or ``.env`` via python-dotenv if present). That keeps
# the checked-in config safe and matches how the API/worker already pick
# up connection info.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Generate revision filenames as ``NNNN_<slug>.py``. Chronologically sorted
# in the directory listing and immediately recognizable against the raw-SQL
# migrations they replace.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
